name: Daily GEO Data & Master DB Auto-Enrichment

on:
  schedule:
    - cron: '0 15 * * *' # 毎日日本時間 24:00 (UTC 15:00) 実行
  workflow_dispatch:

jobs:
  build-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install requests

      - name: Execute Auto-Enrichment Pipeline
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          python scripts/fetch_data.py

      - name: Commit and Push All Generated Assets
        run: |
          git config --global user.name 'GEO-AutoBot'
          git config --global user.email 'bot@users.noreply.github.com'
          git add src/data/songs.json src/data/rights_master.json public/llms.txt public/downloads/viral_song_rights_master.csv
          git commit -m "Auto-update: Refresh songs, enrich master DB with sources, validity & CSV [skip ci]" || exit 0
          git pull --rebase origin main
          git push origin main